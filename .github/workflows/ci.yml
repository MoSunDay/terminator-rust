# CI: workspace build/tests plus the headless multi-window e2e.
# The ghostty VT engine is vendored per-machine (gitignored): fetch it
# first with zig from PyPI, exactly like scripts/fetch-vendor.sh expects.
name: ci
on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install zig 0.16.0 (ghostty vendor build)
        run: pip install ziglang==0.16.0

      - name: Vendor the ghostty VT engine
        run: |
          mkdir -p scripts/bin
          # fetch-vendor.sh calls scripts/bin/zig; point it at the wheel.
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > scripts/bin/zig
          chmod +x scripts/bin/zig
          scripts/fetch-vendor.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test --workspace

  e2e-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install zig 0.16.0 (ghostty vendor build)
        run: pip install ziglang==0.16.0

      - name: Vendor the ghostty VT engine
        run: |
          mkdir -p scripts/bin
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > scripts/bin/zig
          chmod +x scripts/bin/zig
          scripts/fetch-vendor.sh

      - name: Install Xvfb + xdotool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool

      - name: Multi-window e2e (W1-W6)
        run: scripts/bin/e2e-windows.sh

  e2e-window-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install zig 0.16.0 (ghostty vendor build)
        run: pip install ziglang==0.16.0

      - name: Vendor the ghostty VT engine
        run: |
          mkdir -p scripts/bin
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > scripts/bin/zig
          chmod +x scripts/bin/zig
          scripts/fetch-vendor.sh

      - name: Install Xvfb + xdotool + openbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool openbox

      - name: Window-controls e2e (R1-R5, S1-S4)
        run: scripts/bin/e2e-window-controls.sh

  e2e-dragdrop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install zig 0.16.0 (ghostty vendor build)
        run: pip install ziglang==0.16.0

      - name: Vendor the ghostty VT engine
        run: |
          mkdir -p scripts/bin
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > scripts/bin/zig
          chmod +x scripts/bin/zig
          scripts/fetch-vendor.sh

      - name: Install Xvfb + xdotool + scrot + PIL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool scrot python3-pil

      - name: Drag-and-drop e2e (D1-D4)
        run: scripts/bin/e2e-dragdrop.sh

  e2e-empty-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install zig 0.16.0 (ghostty vendor build)
        run: pip install ziglang==0.16.0

      - name: Vendor the ghostty VT engine
        run: |
          mkdir -p scripts/bin
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > scripts/bin/zig
          chmod +x scripts/bin/zig
          scripts/fetch-vendor.sh

      - name: Install Xvfb + xdotool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool

      - name: Empty-restore e2e (E1-E3)
        run: scripts/bin/e2e-empty-restore.sh

  e2e-ime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install zig 0.16.0 (ghostty vendor build)
        run: pip install ziglang==0.16.0

      - name: Vendor the ghostty VT engine
        run: |
          mkdir -p scripts/bin
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > scripts/bin/zig
          chmod +x scripts/bin/zig
          scripts/fetch-vendor.sh

      - name: Install Xvfb + xdotool + scrot + PIL + ibus/libpinyin + dbus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool scrot python3-pil \
            ibus ibus-libpinyin dbus x11-utils locales

      # XIM needs a UTF-8 locale the client can negotiate with; runners
      # ship only en_US/C by default.
      - name: Generate the zh_CN.UTF-8 locale
        run: sudo locale-gen zh_CN.UTF-8

      - name: IME e2e (M1-M4, ibus + libpinyin over XIM)
        run: scripts/bin/e2e-ime.sh
